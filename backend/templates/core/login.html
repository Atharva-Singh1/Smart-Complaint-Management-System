{% extends "core/base.html" %}
{% block title %}SCMS | Login{% endblock %}
{% block content %}<section class="card" style="max-width:560px"><h1>Log in</h1><form method="post">{% csrf_token %}<label for="identifier">Email or phone number</label><input id="identifier" name="identifier" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" required><button>Log in</button></form><p class="small">No account? <a href="{% url 'register' %}">Register as a citizen</a>.</p></section>{% endblock %}
