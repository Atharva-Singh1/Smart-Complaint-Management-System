<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SCMS{% endblock %}</title>
  <style>
    :root { --blue:#154b8b; --ink:#1c2735; --muted:#617083; --bg:#f4f7fb; --border:#d8e0eb; --green:#1f7a4b; --red:#b42318; }
    * { box-sizing:border-box; } body { margin:0; font-family:Arial, sans-serif; color:var(--ink); background:var(--bg); }
    nav { background:var(--blue); color:#fff; padding:15px max(5vw,20px); display:flex; justify-content:space-between; align-items:center; gap:20px; }
    nav a { color:#fff; text-decoration:none; margin-left:14px; } .brand { font-weight:700; font-size:1.1rem; }
    main { max-width:1050px; margin:34px auto; padding:0 20px; } .card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:24px; margin-bottom:20px; box-shadow:0 2px 10px #17375e0c; }
    h1,h2,h3 { margin-top:0; } .lead { color:var(--muted); font-size:1.08rem; line-height:1.55; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; } label { font-weight:600; display:block; margin-top:13px; } input,textarea,select { width:100%; margin-top:6px; padding:10px; border:1px solid #aab7c7; border-radius:6px; font:inherit; } button,.button { display:inline-block; background:var(--blue); color:white; padding:10px 16px; border:0; border-radius:6px; font:inherit; cursor:pointer; text-decoration:none; margin-top:16px; } .button.secondary { background:#e7eef8; color:#143d70; }
    .messages { padding:0; list-style:none; } .messages li { padding:12px 15px; background:#e8f5ee; color:var(--green); border-radius:6px; margin-bottom:10px; } .messages .error { background:#fff0ef; color:var(--red); }
    .errors { color:var(--red); font-size:.9rem; padding-left:18px; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:12px 8px; border-bottom:1px solid var(--border); } th { color:var(--muted); font-size:.85rem; text-transform:uppercase; } .badge { display:inline-block; padding:4px 9px; border-radius:20px; background:#e7eef8; color:#143d70; font-size:.85rem; } .small { color:var(--muted); font-size:.9rem; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; } @media(max-width:700px){ .two{grid-template-columns:1fr;} nav{align-items:flex-start; flex-direction:column;} nav a{margin-left:0;margin-right:12px;} table{font-size:.85rem;} }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="{% url 'home' %}">SCMS · Smart Complaint Management System</a>
  <div>
    <a href="{% url 'track' %}">Track complaint</a>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <form style="display:inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button style="background:none;padding:0;margin:0;border:0">Logout</button></form>
    {% else %}
      <a href="{% url 'login' %}">Login</a><a href="{% url 'register' %}">Register</a>
    {% endif %}
  </div>
</nav>
<main>
  {% if messages %}<ul class="messages">{% for message in messages %}<li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
