services:
  web:
    environment:
      SCMS_DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - database_data:/app/data

  backup:
    build: ./backend
    env_file: .env
    command: ["/bin/sh", "/opt/scms-backups/run_daily.sh"]
    volumes:
      - database_data:/app/data:ro
      - backup_data:/backups
      - ./deploy/backups:/opt/scms-backups:ro
    restart: unless-stopped

volumes:
  database_data:
  backup_data:
